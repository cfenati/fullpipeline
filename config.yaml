output_dir: captures

rgb:
  cam1: /dev/v4l/by-path/pci-0000:67:00.0-usb-0:1.3:1.0-video-index0
  cam2: /dev/v4l/by-path/pci-0000:67:00.0-usb-0:1.2:1.0-video-index0
  # Full IMX298 sensor (MJPG). At 4656x3496 the camera tops out at 10 fps;
  # 30 fps is only available up to 2320x1744.
  width: 4656
  height: 3496
  fps: 30
  # GUI/live preview only — saved captures stay at width x height above.
  preview_max_width: 1280
  # Applied via v4l2-ctl on every open, because driver state resets on
  # replug/reboot.
  controls:
    common:
      # AWB stays off even though the camera default is on: left on, the two
      # cameras white-balance independently per frame and drift out of colour
      # agreement with each other.
      white_balance_automatic: 0
      white_balance_temperature: 5000
      # 3 = Aperture Priority: exposure adapts per scene, so captures always
      # look well exposed. 1 = Manual gives radiometric reproducibility and
      # lets the two cameras be brightness-matched,
      auto_exposure: 3
      gain: 0
      exposure_dynamic_framerate: 0

  color_correction:
    enabled: true
    blur_sigma_fraction: 0.08
    border_fraction: 0.12
    strength: 1.0
    max_gain: 1.6
    min_gain: 0.85
    preview_corrected: true
    on_the_fly_fallback: true
    # Generate with: python check_color.py --image <white_ref.jpg> --save-flat-field
    flat_field_cam1: color_calibration/rgb_cam1_flat_field.npz
    flat_field_cam2: color_calibration/rgb_cam2_flat_field.npz

geometric_calibration:
  # Generate with: python calibrate_cameras.py --in captures/stereo --camera rgb_cam1
  board: calibration/config/charuco_11x8.yaml
  output_dir: calibration/results
  intrinsics_rgb_cam1: calibration/results/rgb_cam1/intrinsics.json
  intrinsics_rgb_cam2: calibration/results/rgb_cam2/intrinsics.json
  # Default --in for calibrate_cameras.py (both cameras) when not passed explicitly.
  # Each captures/stereo/<session>/ has both rgb_cam1.jpg and rgb_cam2.jpg from the
  # same trigger, so one folder serves mono intrinsics for both cameras and the
  # stereo_captures fit below - one consistent source, not three separate ones.
  intrinsics_captures: captures/stereo
  # Sessions used by stereo_calibrate.py, which needs the board visible in both
  # cameras at the same instant. An intrinsics set can be reused - every camera of
  # a trigger goes into one session folder - but only by accident: a set aimed at
  # covering one camera's own frame pushes the board to the edges, which is where
  # the other camera loses it. A folder recorded for the pair, board central and at
  # several distances spanning the confirmed subject working range (0.13-0.19 m;
  # cover both ends, not just one, e.g. 0.13, 0.16, 0.19 m), is the one that gives
  # a good extrinsic fit. A single-distance or narrow-band board set (stereo_9 at
  # 0.139-0.190 m: baseline scatter 2.0%, one view 1.65 deg off fit) yields high
  # epipolar RMS and empty dense stereo. This range is close-range/wide-baseline:
  # see design/config/rig_next_candidate.yaml for the baseline/lens rework needed
  # for dense stereo to work here at all (triangulation angle > 30 deg at the
  # as-built 85.6 mm baseline breaks SGBM correspondence outright).
  # Generate with: python stereo_calibrate.py --in captures/stereo --camera-a rgb_cam1 --camera-b rgb_cam2
  stereo_captures:
    - captures/stereo
  # Held-out second checkerboard pose set for cross_validate_stereo.py. Never
  # used to fit extrinsics, only to check them: a stereo fit is graded by
  # stereo_calibrate.py against the very poses that set its scale, so it can
  # look perfect there and still be wrong. Triangulating this separate set and
  # comparing recovered corner-to-corner distances against the board's known
  # square size catches that in a way in-sample reprojection error cannot.
  cross_validation_captures: captures/cross-validation

  # Depth-grid target for check_depth_accuracy.py: validates RELATIVE stereo
  # depth precision (delta-Z). A flat, fronto-parallel target is depth-agnostic
  # by construction, so this grid of blocks at distinct heights is what
  # actually exercises that axis.
  depth_grid_target: calibration/config/depth_grid_target.yaml
  depth_grid_target_captures: captures/depth_target

  extrinsics_rgb_cam1_rgb_cam2: calibration/results/stereo_rgb_cam1_rgb_cam2/extrinsics.json

registration:
  # Generate with: python register_features.py --session captures/<session>
  output_dir: registration/results
  # Midpoint of the confirmed 0.13-0.19 m subject working range. Used only as
  # stereoRectify's reference_depth (principal-point alignment), never as a
  # per-pixel Z. Every Z comes from triangulation (see triangulate.py).
  default_depth: 0.168
  # Chirality / plausibility window on triangulated Z (metres). Padded
  # slightly around the confirmed 0.13-0.19 m subject working range so real
  # depth variation near the edges isn't clipped. Not a plane to project onto.
  depth_range: [0.11, 0.21]
  # cv2.stereoRectify free-scaling parameter: 0 crops to pixels valid in both
  # frames, 1 keeps everything (black borders). At the current as-built pose
  # (50.2 mm baseline, 17.5 deg convergence), alpha=0 crops to a tiny mutually
  # -valid region and compensates with an inflated focal length (32k px vs the
  # camera's real ~10.7k px), which pushes the disparity range past the SGBM
  # search window and zeroes dense coverage outright. alpha=1.0 measured
  # 0%->7-12% dense coverage on the same captures. Re-check this after any
  # rig pose change — recompute with:
  #   python -c "from calibration.stereo import StereoExtrinsics, rectify; \
  #   ex = StereoExtrinsics.load_json('calibration/results/stereo_rgb_cam1_rgb_cam2/extrinsics.json'); \
  #   [print(a, rectify(ex, alpha=a, reference_depth=0.168).P1[0,0]) for a in (0.0, 0.5, 1.0)]"
  rectification_alpha: 1.0
  rig: design/config/rig_as_built.yaml

thermal:
  config_xml: OptrixThermalCamera/config/generic.xml
  warmup_seconds: 1
  accuracy_abs_c: 2.0   # Optris datasheet: +/-2C or +/-2% of reading, whichever is larger
  accuracy_pct: 2.0

blackfly:
  enabled: true
  camera_index: 0
  serial: null
  timeout_ms: 1000
  # null = do not cap AcquisitionFrameRate (camera runs at its max for the mode).
  # Saves always use full sensor; preview_max_width only affects the GUI stream.
  max_fps: null
  preview_max_width: 1280
  stream_newest_only: true
  gain_auto: true
  gain: null
  # Used only by `capture_pipeline.py --flir-gain-sweep`, which always runs
  # in manual gain regardless of gain_auto above. Range is dB (Spinnaker's
  # Gain node); on this rig's BFS-U3-32S4M it spans 0-48 dB, so 20-40 leaves
  # headroom on both ends while the right operating gain is still unknown.
  gain_sweep:
    start: 20
    stop: 40
    step: 5

stability:
  preview_interval_ms: 33
  parallel_grab: true
  recover_rgb: true
  recover_settle_s: 2.0
  warmup_rgb: false
  open_rgb_before_thermal: true

gui:
  window_size: "1400x920"
